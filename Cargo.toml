[package]
name = "blast"
version = "0.1.0"
edition = "2021"

# Exclude build artifacts but KEEP templates/canonical/ — that's the
# vendored framework source baked into the binary via include_dir!.
exclude = [
    "target/",
    "**/*.rs.bk",
    ".git/",
    ".gitignore",
    "templates/canonical/target/",
    "templates/canonical/Cargo.lock",
    "templates/canonical/storage/logs/*.log",
    "tests/"
]

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console = "0.15.8"
dialoguer = {version ="0.11.0", features = ["history", "completion", "fuzzy-select"]}
diesel = { version = "2.2.3", features = ["postgres", "64-column-tables", "chrono"] }
dotenv = "0.15.0"
indicatif = "0.17.8"
toml = "0.8.19"
toml_edit = "0.22.24"
reqwest = {version = "0.12.12", features = ["blocking", "json"] } 
sass-rs = "0.2.2"
css-minify = "0.5.2"
walkdir = "2.5.0"
regex = "1.11.1"
rand = "0.9.0"
lazy_static = "1.4.0"
chrono = "0.4.34"
libc = "0.2.153"
url = "2.5.0"
prettytable = "0.10.0"
ratatui = "0.28"
crossterm = "0.28"
tokio = { version = "1.0", features = ["full"] }
notify = "6.0"
fuzzy-matcher = "0.3"
clap = { version = "4", features = ["derive"] }
syn = { version = "2.0", features = ["full", "extra-traits"] }
proc-macro2 = "1.0"
rayon = "1.10"
quote = "1.0"
ron = "0.8"
indexmap = { version = "2", features = ["serde"] }
blake3 = "1.5"
Inflector = "0.11"
include_dir = "0.7"

[dev-dependencies]
tempfile = "3"
