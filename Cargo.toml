[package]
name = "blast"
version = "0.1.0"
edition = "2021"

exclude = [
    "target/",
    "**/*.rs.bk",
    ".git/",
    ".gitignore",
    "tests/"
]

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console = "0.15.8"
diesel = { version = "2.2.3", features = ["postgres", "64-column-tables", "chrono"] }
dotenv = "0.15.0"
indicatif = "0.17.8"
toml = "0.8.19"
toml_edit = "0.22.24"
chrono = "0.4.34"
ratatui = "0.28"
crossterm = "0.28"
tui-input = "0.10"
clap = { version = "4", features = ["derive"] }
which = "7"
tempfile = "3"

[dev-dependencies]
