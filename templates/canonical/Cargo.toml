[package]
name = "{{project_name}}"
version = "0.1.0"
edition = "2021"

[features]
testing = []

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chrono = { version = "0.4.39", features = ["serde"] }
diesel-async = { version = "0.5.2", features = ["postgres", "r2d2", "tokio", "deadpool"] }
diesel = { version = "2.2.7", features = ["postgres", "64-column-tables", "chrono", "serde_json", "r2d2"] }
diesel_migrations = { version = "2.2", features = ["postgres"] }
dotenv = "0.15.0"
flate2 = "1.0.35"
once_cell = "1.20.3"
axum = { version = "0.7", features = ["json", "macros", "ws"] }
axum-extra = { version = "0.9", features = ["cookie", "form"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
thiserror = "1.0"
anyhow = "1.0"
serde_json = "1.0"
serde = { version = "1.0.217", features = ["derive"] }
tokio = { version = "1.40.0", features = ["full"] }
toml = "0.8.20"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
notify = "5.0.0"
rand = "0.8.5"
sha2 = "0.10"
bs58 = "0.5"
uuid = { version = "1.8.0", features = ["v4", "serde"] }
backtrace = "0.3"
hyper = { version = "1.0", features = ["full"] }
dashmap = "6.1"
futures-util = { version = "0.3", features = ["async-await-macro"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname"] }
cron = "0.12"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.dev]
codegen-units = 12
opt-level = 0
lto = false
debug = true

[profile.release]
codegen-units = 1
opt-level = 3
lto = "fat"
debug = false
