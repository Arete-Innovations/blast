[package]
name = "e2e"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "e2e"
path = "src/main.rs"

[dependencies]
fantoccini = "0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[workspace]
