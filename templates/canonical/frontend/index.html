<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{project_name}}</title>
    <style>
      html, body { margin: 0; padding: 0; min-height: 100vh; }
      body {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #0b0d10;
        color: #e6e8eb;
      }
      #app { min-height: 100vh; }
      .pre-mount-shell {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .pre-mount-shell-mark {
        font-size: 14px;
        opacity: 0.6;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .pre-mount-progress {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        overflow: hidden;
        z-index: 9999;
        pointer-events: none;
      }
      .pre-mount-progress-fill {
        width: 40%;
        height: 100%;
        background: #7c3aed;
        animation: pre-mount-slide 1.1s linear infinite;
      }
      @keyframes pre-mount-slide {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>
  <body>
    <div class="pre-mount-progress" aria-hidden="true">
      <div class="pre-mount-progress-fill"></div>
    </div>
    <div id="app">
      <div class="pre-mount-shell">
        <span class="pre-mount-shell-mark">loading</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
